name: Build JDHalfrack 4029 Android Port

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-jd4029-android.yml
  workflow_dispatch:

jobs:
  build:
    name: JD4029 Android ABI Test
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null || true

      - name: Download Android scaffold
        run: |
          set -euxo pipefail
          curl -L "https://github.com/pontos2024/PCSX2/archive/1f766cad23a3240c87880c1f29925005ac119ca0.zip" -o mobile.zip
          unzip -q mobile.zip
          mv PCSX2-1f766cad23a3240c87880c1f29925005ac119ca0 mobile

      - name: Download exact JDHalfrack 1.7.4029 source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --depth 1 --branch v1.7.4029 https://github.com/JDHalfrack/pcsx2.git jd4029
          git -C jd4029 rev-parse HEAD
          git -C jd4029 describe --tags --exact-match

      - name: Inspect Aether ARM64 recompiler
        run: |
          set -euxo pipefail
          LIB=mobile/app/src/main/cpp/pcsx2/libRecompiler.a
          test -f "$LIB"
          mkdir -p inspect
          file "$LIB" | tee inspect/libRecompiler-file.txt
          nm -A -g --defined-only "$LIB" > inspect/libRecompiler-defined.txt 2>&1 || true
          nm -A -u "$LIB" > inspect/libRecompiler-undefined.txt 2>&1 || true
          strings -a "$LIB" > inspect/libRecompiler-strings.txt 2>&1 || true
          grep -E ' recCpu$| psxRec$| microVU0$| microVU1$' inspect/libRecompiler-defined.txt || true
          wc -c "$LIB"

      - name: Upload recompiler inspection
        uses: actions/upload-artifact@v4
        with:
          name: Aether-libRecompiler-ABI
          path: |
            inspect/*
            mobile/app/src/main/cpp/pcsx2/libRecompiler.a
          if-no-files-found: error

      - name: Overlay exact 4029 core sources
        run: |
          set -euxo pipefail
          # Keep Android ARM64 compatibility headers before overlaying the exact core.
          cp mobile/app/src/main/cpp/pcsx2/GS/GSIntrin.h /tmp/GSIntrin.android.h
          cp mobile/app/src/main/cpp/pcsx2/SingleRegisterTypes.h /tmp/SingleRegisterTypes.android.h
          mkdir -p /tmp/aether-host
          cp -a mobile/app/src/main/cpp/pcsx2/PAD/Host /tmp/aether-host/PAD-Host
          cp mobile/app/src/main/cpp/pcsx2/SaveState.h /tmp/aether-host/SaveState.h
          cp mobile/app/src/main/cpp/pcsx2/SaveState.cpp /tmp/aether-host/SaveState.cpp
          cp mobile/app/src/main/cpp/pcsx2/GameDatabase.h /tmp/aether-host/GameDatabase.h
          cp mobile/app/src/main/cpp/pcsx2/GameDatabase.cpp /tmp/aether-host/GameDatabase.cpp
          cp mobile/app/src/main/cpp/pcsx2/vtlb.h /tmp/aether-host/vtlb.h
          cp mobile/app/src/main/cpp/pcsx2/vtlb.cpp /tmp/aether-host/vtlb.cpp
          cp mobile/app/src/main/cpp/pcsx2/Memory.h /tmp/aether-host/Memory.h
          cp mobile/app/src/main/cpp/pcsx2/Memory.cpp /tmp/aether-host/Memory.cpp
          cp mobile/app/src/main/cpp/pcsx2/System.h /tmp/aether-host/System.h
          cp mobile/app/src/main/cpp/pcsx2/System.cpp /tmp/aether-host/System.cpp
          cp mobile/app/src/main/cpp/pcsx2/System/RecTypes.h /tmp/aether-host/RecTypes.h
          cp -a mobile/app/src/main/cpp/pcsx2/DebugTools /tmp/aether-host/DebugTools

          # Keep the Android-specific CMake/source-list glue and the prebuilt
          # ARM64 recompiler archive from the scaffold. Replace same-path core
          # implementation files with the exact JDHalfrack 1.7.4029 versions.
          rsync -a --exclude=CMakeLists.txt --exclude=libRecompiler.a jd4029/pcsx2/ mobile/app/src/main/cpp/pcsx2/

          # Restore only ARM64 compatibility shims. Texture replacement remains exact 4029.
          cp /tmp/GSIntrin.android.h mobile/app/src/main/cpp/pcsx2/GS/GSIntrin.h
          cp /tmp/SingleRegisterTypes.android.h mobile/app/src/main/cpp/pcsx2/SingleRegisterTypes.h
          rm -rf mobile/app/src/main/cpp/pcsx2/PAD/Host
          cp -a /tmp/aether-host/PAD-Host mobile/app/src/main/cpp/pcsx2/PAD/Host
          cp /tmp/aether-host/SaveState.h mobile/app/src/main/cpp/pcsx2/SaveState.h
          cp /tmp/aether-host/SaveState.cpp mobile/app/src/main/cpp/pcsx2/SaveState.cpp
          cp /tmp/aether-host/GameDatabase.h mobile/app/src/main/cpp/pcsx2/GameDatabase.h
          cp /tmp/aether-host/GameDatabase.cpp mobile/app/src/main/cpp/pcsx2/GameDatabase.cpp
          cp /tmp/aether-host/vtlb.h mobile/app/src/main/cpp/pcsx2/vtlb.h
          cp /tmp/aether-host/vtlb.cpp mobile/app/src/main/cpp/pcsx2/vtlb.cpp
          cp /tmp/aether-host/Memory.h mobile/app/src/main/cpp/pcsx2/Memory.h
          cp /tmp/aether-host/Memory.cpp mobile/app/src/main/cpp/pcsx2/Memory.cpp
          cp /tmp/aether-host/System.h mobile/app/src/main/cpp/pcsx2/System.h
          cp /tmp/aether-host/System.cpp mobile/app/src/main/cpp/pcsx2/System.cpp
          cp /tmp/aether-host/RecTypes.h mobile/app/src/main/cpp/pcsx2/System/RecTypes.h
          rm -f mobile/app/src/main/cpp/pcsx2/VirtualMemory.h mobile/app/src/main/cpp/pcsx2/VirtualMemory.cpp
          rm -rf mobile/app/src/main/cpp/pcsx2/DebugTools
          cp -a /tmp/aether-host/DebugTools mobile/app/src/main/cpp/pcsx2/DebugTools

          # Aether's Android PAD host polls devices at guest vsync. JD4029 calls
          # PAD::Update() at the same frame boundary, so provide a compatibility alias.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mobile/app/src/main/cpp/pcsx2/PAD/Host/PAD.h")
          s = p.read_text()
          needle = '\tvoid PollDevices();'
          repl = '\tvoid PollDevices();\n\tinline void Update() { PollDevices(); }'
          if needle not in s:
              raise SystemExit("Aether PAD PollDevices declaration not found")
          if 'inline void Update()' not in s:
              s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY

          # Aether/Android polls input devices from VMManager. JD4029's PAD::Update()
          # belongs to the newer desktop PAD API and is not present in this Android host.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mobile/app/src/main/cpp/pcsx2/Counters.cpp")
          s = p.read_text()
          s = s.replace("\tPAD::Update();", "\t// Android host polls PAD devices in VMManager.")
          p.write_text(s)
          PY
          # Keep the Android/Aether common runtime. Exact 4029 common is desktop-oriented
          # and breaks the mobile host ABI (Threading/EventSource/etc.). The emulation
          # core and GS/texture code remain exact 4029.

          # The texture-replacement implementation must be byte-for-byte the
          # exact 1.7.4029 source after the overlay.
          cmp jd4029/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp mobile/app/src/main/cpp/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          sha256sum jd4029/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          grep -F 'TEXTURE_FILENAME_FORMAT_STRING' mobile/app/src/main/cpp/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          grep -F 'TEXTURE_FILENAME_CLUT_FORMAT_STRING' mobile/app/src/main/cpp/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp

      - name: Patch 4029 architecture gate for ARM64
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mobile/app/src/main/cpp/pcsx2/PCSX2Base.h")
          s = p.read_text()
          if "defined(_M_ARM64)" not in s and "defined(__aarch64__)" not in s:
              needle = "#if defined(__AVX2__)"
              if needle not in s:
                  raise SystemExit("PCSX2Base AVX2 architecture gate not found")
              repl = "#if defined(_M_ARM64) || defined(__aarch64__)" + chr(10) + chr(9) + "#define _M_SSE 0x401" + chr(10) + "#elif defined(__AVX2__)"
              s = s.replace(needle, repl, 1)
              p.write_text(s)
          PY
          grep -n -A12 '^#if defined(_M_ARM64)' mobile/app/src/main/cpp/pcsx2/PCSX2Base.h
          head -n 30 mobile/app/src/main/cpp/pcsx2/GS/GSIntrin.h

      - name: Build exact-4029 core with Android ARM64 recompiler
        working-directory: mobile
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find mobile/app/build/outputs/apk -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" out/JD4029-AetherARM64-ABI-test.apk
          sha256sum out/JD4029-AetherARM64-ABI-test.apk > out/JD4029-AetherARM64-ABI-test.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JD4029-AetherARM64-ABI-test
          path: out/*
          if-no-files-found: error
