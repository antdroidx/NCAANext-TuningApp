name: Build JDHalfrack 4029 Android Port

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-jd4029-android.yml
  workflow_dispatch:

jobs:
  build:
    name: JD4029 Android ABI Test
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null || true

      - name: Download Android scaffold
        run: |
          set -euxo pipefail
          curl -L "https://github.com/pontos2024/PCSX2/archive/1f766cad23a3240c87880c1f29925005ac119ca0.zip" -o mobile.zip
          unzip -q mobile.zip
          mv PCSX2-1f766cad23a3240c87880c1f29925005ac119ca0 mobile

      - name: Download exact JDHalfrack 1.7.4029 source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --depth 1 --branch v1.7.4029 https://github.com/JDHalfrack/pcsx2.git jd4029
          git -C jd4029 rev-parse HEAD
          git -C jd4029 describe --tags --exact-match

      - name: Inspect Aether ARM64 recompiler
        run: |
          set -euxo pipefail
          LIB=mobile/app/src/main/cpp/pcsx2/libRecompiler.a
          test -f "$LIB"
          mkdir -p inspect
          file "$LIB" | tee inspect/libRecompiler-file.txt
          nm -A -g --defined-only "$LIB" > inspect/libRecompiler-defined.txt 2>&1 || true
          nm -A -u "$LIB" > inspect/libRecompiler-undefined.txt 2>&1 || true
          strings -a "$LIB" > inspect/libRecompiler-strings.txt 2>&1 || true
          grep -E ' recCpu$| psxRec$| microVU0$| microVU1$' inspect/libRecompiler-defined.txt || true
          wc -c "$LIB"

      - name: Upload recompiler inspection
        uses: actions/upload-artifact@v4
        with:
          name: Aether-libRecompiler-ABI
          path: |
            inspect/*
            mobile/app/src/main/cpp/pcsx2/libRecompiler.a
          if-no-files-found: error

      - name: Overlay exact 4029 core sources
        run: |
          set -euxo pipefail
          # Keep the Android-specific CMake/source-list glue and the prebuilt
          # ARM64 recompiler archive from the scaffold. Replace same-path core
          # implementation files with the exact JDHalfrack 1.7.4029 versions.
          rsync -a --exclude=CMakeLists.txt --exclude=libRecompiler.a jd4029/pcsx2/ mobile/app/src/main/cpp/pcsx2/
          rsync -a --exclude=CMakeLists.txt jd4029/common/ mobile/app/src/main/cpp/common/

          # The texture-replacement implementation must be byte-for-byte the
          # exact 1.7.4029 source after the overlay.
          cmp jd4029/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp mobile/app/src/main/cpp/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          sha256sum jd4029/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          grep -F 'TEXTURE_FILENAME_FORMAT_STRING' mobile/app/src/main/cpp/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          grep -F 'TEXTURE_FILENAME_CLUT_FORMAT_STRING' mobile/app/src/main/cpp/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp

      - name: Build exact-4029 core with Android ARM64 recompiler
        working-directory: mobile
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find mobile/app/build/outputs/apk -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" out/JD4029-AetherARM64-ABI-test.apk
          sha256sum out/JD4029-AetherARM64-ABI-test.apk > out/JD4029-AetherARM64-ABI-test.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JD4029-AetherARM64-ABI-test
          path: out/*
          if-no-files-found: error
