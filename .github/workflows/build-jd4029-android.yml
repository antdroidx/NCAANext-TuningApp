name: Build JDHalfrack 4029 Android Port

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-jd4029-android.yml
  workflow_dispatch:

jobs:
  build:
    name: JD4029 Android Transplant
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null || true

      - name: Download Android scaffold
        run: |
          set -euxo pipefail
          curl -L "https://github.com/pontos2024/PCSX2/archive/1f766cad23a3240c87880c1f29925005ac119ca0.zip" -o mobile.zip
          unzip -q mobile.zip
          mv PCSX2-1f766cad23a3240c87880c1f29925005ac119ca0 mobile

      - name: Inspect Aether recompiler library
        run: |
          set -euxo pipefail
          LIB=mobile/app/src/main/cpp/pcsx2/libRecompiler.a
          test -f "$LIB"
          file "$LIB"
          mkdir -p inspect
          readelf -h "$LIB" > inspect/libRecompiler-readelf.txt 2>&1 || true
          nm -A -g --defined-only "$LIB" > inspect/libRecompiler-symbols.txt 2>&1 || true
          grep -Ei 'recCpu|psxRec|mVU|microVU|R5900|Reserve|Execute|recReset|recShutdown' inspect/libRecompiler-symbols.txt | head -n 300 || true
          wc -c "$LIB"
          wc -l inspect/libRecompiler-symbols.txt || true

      - name: Upload recompiler inspection
        uses: actions/upload-artifact@v4
        with:
          name: Aether-libRecompiler-inspection
          path: inspect/*
          if-no-files-found: warn

      - name: Build Android delta on 3668
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/JDHalfrack/pcsx2.git core
          cd core
          git config user.name "NCAA NEXT CI"
          git config user.email "ci@ncaanext.invalid"
          git checkout -q v1.7.3668
          cp -a ../mobile/app/src/main/cpp/. .
          git add -A
          git commit -m "Aether era Android scaffold delta"
          echo "ANDROID_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Forward-port Android delta to exact JDHalfrack 4029
        run: |
          set -euxo pipefail
          cd core
          git checkout -q v1.7.4029
          if ! git cherry-pick "$ANDROID_COMMIT"; then
            echo "CONFLICTS BEGIN"
            git diff --name-only --diff-filter=U
            echo "CONFLICTS END"
            exit 20
          fi
          git log -2 --oneline

      - name: Verify old 4029 texture naming
        run: |
          set -euxo pipefail
          grep -F 'TEXTURE_FILENAME_FORMAT_STRING' core/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp
          grep -F 'TEXTURE_FILENAME_CLUT_FORMAT_STRING' core/pcsx2/GS/Renderers/HW/GSTextureReplacements.cpp

      - name: Install merged core in Android project
        run: |
          set -euxo pipefail
          rm -rf mobile/app/src/main/cpp
          mkdir -p mobile/app/src/main/cpp
          rsync -a --exclude=.git core/ mobile/app/src/main/cpp/

      - name: Build baseline APK
        working-directory: mobile
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find mobile/app/build/outputs/apk -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" out/JD4029-Android-baseline.apk
          sha256sum out/JD4029-Android-baseline.apk > out/JD4029-Android-baseline.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JD4029-Android-baseline
          path: out/*
          if-no-files-found: error
